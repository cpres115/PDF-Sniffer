# PDF Sniffer settings (optional). Lines starting with # are comments.
# Remove the leading # from a setting to change it.

[revisions]
# How the drawing number and revision are read from PDF file names.
# Leave this unset to use the built-in recognition, which understands names such as
#   12345-678 Rev B.pdf   12345-678_RevB.pdf   MWI-1042_REV_02.pdf   12345-678-B.pdf   12345_B.pdf
# If your file names follow a different scheme, give a regular expression with the two named
# groups "number" and "rev". It is matched against the file name without ".pdf", without a
# trailing -EAR / -ITAR, without copy markers and without the REDLINE word. Example for names
# like 12345-678_B.pdf :
# name_pattern = ^(?P<number>\d{5}-\d{3})_(?P<rev>[A-Z]{1,2})$
#
# Words that mark a REDLINE file (anywhere after the drawing number; the word and anything after it
# are ignored when reading the name). Spaces and hyphens inside a word are optional ("red line" also
# matches "redline" and "red-line"); words of 5+ letters also match longer forms ("redlined").
# Built-in list: redline; red line; markup; mark up; marked up; redln; rdln; mkup; rl
# redline_words = redline; red line; markup; mark up; marked up; redln; rdln; mkup; rl

[advisory]
# Pages that contain one of these headings carry a table explaining what the ITAR / EAR logos
# look like (the "General Symbol Advisory" table of MWI files). Logos inside that table are ignored.
# Separate several headings with a semicolon. Leave the value empty to turn this off.
# phrases = GENERAL SYMBOL ADVISORY

[folders]
# Folders with these names are skipped in all cases: the folder and everything inside it, wherever it
# is found (also when you give it directly). The comparison ignores upper/lower case and extra spaces.
# Separate several names with a semicolon.
# skip = - Engineering Release
